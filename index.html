<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>המלאך אוריאל</title>
  <link rel="icon" type="image/png" href="icon.png">
  <link rel="shortcut icon" href="icon.png">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#140a24">

  <style>
    :root {
      --bg1:#140a24;
      --bg2:#2a1248;
      --gold:#e9c766;
      --text:#faf5ff;
      --muted:#d9caeb;
    }

    * { box-sizing:border-box; }

    body {
      margin:0;
      min-height:100vh;
      font-family:Arial, "Noto Sans Hebrew", sans-serif;
      color:var(--text);
      background:
        radial-gradient(circle at 50% 18%, rgba(233,199,102,.18), transparent 22%),
        linear-gradient(180deg, var(--bg2), var(--bg1) 62%);
      display:flex;
      justify-content:center;
      align-items:flex-start;
      padding:18px 16px 24px;
    }

    .app {
      width:min(100%, 520px);
      text-align:center;
    }

    .portal {
      animation:fadeIn .9s ease;
      margin-bottom:8px;
    }

    @keyframes fadeIn {
      from { opacity:0; transform:translateY(12px); }
      to { opacity:1; transform:translateY(0); }
    }

    h1 {
      margin:0;
      font-size:clamp(28px, 5vw, 40px);
      line-height:1.18;
      text-shadow:0 0 16px rgba(233,199,102,.15);
    }

    .name {
      margin-top:8px;
      font-size:18px;
      color:var(--muted);
    }

    .tagline {
      margin-top:6px;
      font-size:20px;
    }

    button {
      margin-top:14px;
      border:0;
      border-radius:999px;
      padding:15px 30px;
      font-size:22px;
      font-weight:700;
      cursor:pointer;
      color:#3b1b50;
      background:linear-gradient(180deg, #fff6b7, var(--gold));
      box-shadow:0 10px 24px rgba(0,0,0,.22), 0 0 18px rgba(233,199,102,.18);
    }

    .action-box {
      opacity:0;
      transform:translateY(-6px) scale(.985);
      transition:
        opacity .65s ease,
        transform .65s ease,
        filter .65s ease;
      margin-top:10px;
      min-height:42px;
      pointer-events:none;
      filter:blur(1px);
    }

    .action-box.show {
      opacity:1;
      transform:translateY(0) scale(1);
      pointer-events:auto;
      filter:blur(0);
    }

    .action-btn {
      display:inline-block;
      padding:10px 18px;
      border-radius:999px;
      color:#f6df9a;
      font-size:14px;
      font-weight:600;
      text-align:center;
      text-decoration:none;
      letter-spacing:.2px;
      background:rgba(255,255,255,.04);
      border:1px solid rgba(233,199,102,.34);
      box-shadow:
        0 0 18px rgba(233,199,102,.10),
        inset 0 0 12px rgba(255,255,255,.03);
      backdrop-filter:blur(3px);
      -webkit-backdrop-filter:blur(3px);
      transition:
        transform .25s ease,
        box-shadow .25s ease,
        opacity .25s ease,
        background .25s ease;
      opacity:.94;
      -webkit-tap-highlight-color: transparent;
      max-width:min(100%, 360px);
      line-height:1.45;
    }

    .action-btn:hover {
      transform:translateY(-1px) scale(1.01);
      box-shadow:
        0 0 22px rgba(233,199,102,.18),
        0 0 34px rgba(233,199,102,.08),
        inset 0 0 12px rgba(255,255,255,.05);
      background:rgba(255,255,255,.06);
    }

    .action-btn:active {
      transform:scale(.98);
    }

    .stage {
      position:relative;
      width:min(100%, 390px);
      margin:8px auto 0;
    }

    .card {
      width:100%;
      aspect-ratio:909 / 1252;
      border-radius:30px;
      overflow:hidden;
      box-shadow:0 20px 50px rgba(0,0,0,.42), 0 0 22px rgba(233,199,102,.14);
      background:rgba(255,255,255,.02);
    }

    .card img {
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
      user-select:none;
      -webkit-user-drag:none;
    }

    .sparkles {
      position:absolute;
      left:50%;
      transform:translateX(-50%);
      width:88%;
      height:120px;
      pointer-events:none;
      opacity:0;
      z-index:3;
    }

    .sparkles.top { top:10px; }
    .sparkles.bottom { bottom:10px; transform:translateX(-50%) scaleY(-1); }
    .sparkles.show { animation:sparkleFade 1.45s ease forwards; }

    .sparkles::before {
      content:"";
      position:absolute;
      inset:0;
      background:
        radial-gradient(circle at 10% 46%, rgba(255,234,186,.98) 0 2px, transparent 3px),
        radial-gradient(circle at 22% 28%, rgba(255,214,104,.98) 0 1.8px, transparent 3px),
        radial-gradient(circle at 34% 58%, rgba(255,247,224,.98) 0 2px, transparent 3px),
        radial-gradient(circle at 46% 34%, rgba(247,196,91,.98) 0 2px, transparent 3px),
        radial-gradient(circle at 58% 54%, rgba(255,239,187,.98) 0 1.7px, transparent 3px),
        radial-gradient(circle at 72% 38%, rgba(255,213,110,.98) 0 2px, transparent 3px),
        radial-gradient(circle at 84% 61%, rgba(255,248,228,.98) 0 2px, transparent 3px),
        radial-gradient(circle at 94% 42%, rgba(255,206,95,.98) 0 1.8px, transparent 3px);
      animation:drift 1.45s ease-out forwards;
    }

    @keyframes sparkleFade {
      0% { opacity:0; }
      15% { opacity:1; }
      100% { opacity:0; }
    }

    @keyframes drift {
      0% { transform:translateY(8px) scale(.97); opacity:0; }
      18% { transform:translateY(0) scale(1); opacity:1; }
      100% { transform:translateY(-18px) scale(1.02); opacity:0; }
    }

    .status-row {
      margin-top:10px;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:10px;
      min-height:28px;
    }

    .status {
      min-height:24px;
      color:var(--muted);
      font-size:15px;
      transition:opacity .3s ease;
    }
/* === SHARE DIAMOND === */

.share-diamond {
  width:26px;
  height:26px;
  position:relative;
  cursor:pointer;
  flex:0 0 auto;

  transform:rotate(45deg);
  transition:all .3s ease;

  animation:diamondBreath 3.2s ease-in-out infinite;
}

/* ромб */
.share-diamond::before {
  content:"";
  position:absolute;
  inset:0;
  border-radius:4px;

  background:linear-gradient(
    180deg,
    rgba(255,246,183,0.28),
    rgba(233,199,102,0.20)
  );

  border:1px solid rgba(233,199,102,0.55);

  box-shadow:
    0 0 12px rgba(233,199,102,0.18),
    inset 0 0 10px rgba(255,255,255,0.06);

  transition:all .3s ease;
  animation:diamondGlow 3.2s ease-in-out infinite;
}

/* стрелка */
.share-diamond::after {
  content:"↗";
  position:absolute;
  inset:0;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:15px;
  font-weight:700;
  color:#f8e6a6;

  transform:rotate(-45deg);
}

/* дыхание */
@keyframes diamondBreath {
  0% { transform:rotate(45deg) scale(1); }
  50% { transform:rotate(45deg) scale(1.06); }
  100% { transform:rotate(45deg) scale(1); }
}

/* свечение */
@keyframes diamondGlow {
  0% {
    box-shadow:
      0 0 10px rgba(233,199,102,0.15),
      inset 0 0 8px rgba(255,255,255,0.05);
  }
  50% {
    box-shadow:
      0 0 20px rgba(233,199,102,0.35),
      0 0 32px rgba(233,199,102,0.15),
      inset 0 0 12px rgba(255,255,255,0.08);
  }
  100% {
    box-shadow:
      0 0 10px rgba(233,199,102,0.15),
      inset 0 0 8px rgba(255,255,255,0.05);
  }
}

.share-diamond:hover {
  transform:rotate(45deg) scale(1.14);
}

.share-diamond:hover::before {
  box-shadow:
    0 0 26px rgba(233,199,102,0.45),
    0 0 40px rgba(233,199,102,0.22),
    inset 0 0 14px rgba(255,255,255,0.12);
}

.share-diamond:active {
  transform:rotate(45deg) scale(0.92);
}
    .share-modal {
      position:fixed;
      inset:0;
      background:rgba(7,3,16,.62);
      display:flex;
      align-items:center;
      justify-content:center;
      opacity:0;
      pointer-events:none;
      transition:opacity .35s ease;
      padding:20px;
      z-index:50;
    }

    .share-modal.show {
      opacity:1;
      pointer-events:auto;
    }

    .share-modal-card {
      width:min(100%, 340px);
      border-radius:24px;
      padding:24px 20px 20px;
      background:
        radial-gradient(circle at 50% 10%, rgba(233,199,102,.10), transparent 30%),
        linear-gradient(180deg, #2a1248, #140a24 70%);
      box-shadow:0 18px 50px rgba(0,0,0,.38), 0 0 22px rgba(233,199,102,.10);
      text-align:center;
      transform:translateY(10px) scale(.98);
      transition:transform .35s ease;
    }

    .share-modal.show .share-modal-card {
      transform:translateY(0) scale(1);
    }

    .share-modal-title {
      font-size:22px;
      line-height:1.25;
      margin-bottom:10px;
      color:var(--text);
    }

    .share-modal-text {
      font-size:15px;
      line-height:1.5;
      color:var(--muted);
      margin-bottom:18px;
    }

    .share-app-btn {
      border:0;
      border-radius:999px;
      padding:12px 22px;
      font-size:16px;
      font-weight:700;
      cursor:pointer;
      color:#3b1b50;
      background:linear-gradient(180deg, #fff6b7, var(--gold));
      box-shadow:0 10px 24px rgba(0,0,0,.18), 0 0 18px rgba(233,199,102,.14);
    }

    button, .btn, .button {
      outline:none !important;
      -webkit-tap-highlight-color: transparent;
    }

    button:focus, button:active,
    .btn:focus, .btn:active,
    .button:focus, .button:active,
    .action-btn:focus, .action-btn:active,
    .share-mini-btn:focus, .share-mini-btn:active,
    .share-app-btn:focus, .share-app-btn:active {
      outline:none !important;
      box-shadow:none !important;
    }

    .card.pulse {
      animation:mandalaPulse 0.85s ease;
    }

    @keyframes mandalaPulse {
      0% { transform:scale(1); }
      40% { transform:scale(1.02); }
      100% { transform:scale(1); }
    }
  </style>

    function showActionButton(text, href = "#", mode = "link") {
      actionBtn.textContent = text;
      actionBtn.href = href;

      if (mode === "install") {
        actionBtn.removeAttribute("target");
      } else {
        actionBtn.setAttribute("target", "_blank");
      }

      actionBox.classList.remove("show");
      void actionBox.offsetWidth;
      actionBox.classList.add("show");
    }

      actionBox.classList.remove("show");

    function updateActionButton(count) {
      if (deferredPrompt && !localStorage.getItem("appInstalled")) {
        showActionButton("✨ רגע של אור בכף ידך", "#", "install");
        return;
      }

      if (count % 7 === 0) {
        showActionButton(
          "רוצה את הקלפים עם מסר אישי ממני?",
          "https://wa.me/972503138035?text=" +
          encodeURIComponent("היי מוריאל, אהבתי את הקלפים ואני רוצה לשמוע על החפיסה עם המסר האישי"),
          "link"
        );
      } else {
        hideActionButton();
      }
    }

    window.addEventListener("beforeinstallprompt", (e) => {
      e.preventDefault();
      deferredPrompt = e;
    });

    actionBtn.addEventListener("click", async (e) => {
      if (
        deferredPrompt &&
        !localStorage.getItem("appInstalled") &&
        actionBtn.textContent.includes("רגע של אור בכף ידך")
      ) {
        e.preventDefault();

        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;

        if (outcome === "accepted") {
          localStorage.setItem("appInstalled", "true");
          hideActionButton();
        }

        deferredPrompt = null;

        let count = Number(localStorage.getItem("drawCount") || 0);
        updateActionButton(count);
      }
    });

    window.addEventListener("appinstalled", () => {
      localStorage.setItem("appInstalled", "true");
      deferredPrompt = null;

      let count = Number(localStorage.getItem("drawCount") || 0);
      updateActionButton(count);
    });

    shareMiniBtn.addEventListener("click", () => {
      shareModal.classList.add("show");
    });

    shareModal.addEventListener("click", (e) => {
      if (e.target === shareModal) {
        shareModal.classList.remove("show");
      }
    });

    shareAppBtn.addEventListener("click", async () => {
      const appUrl = window.location.origin + window.location.pathname;
      const shareText = "✨ קיבלתי מסר מהמלאך אוריאל ורציתי לשתף אותך באפליקציה";

      try {
        if (navigator.share) {
          await navigator.share({
            title: "המלאך אוריאל",
            text: shareText,
            url: appUrl
          });
        } else {
          window.open(
            "https://wa.me/?text=" + encodeURIComponent(shareText + " " + appUrl),
            "_blank"
          );
        }
      } catch (e) {
      }

      shareModal.classList.remove("show");
    });

    function flashSparkles() {
      const sparkTop = document.getElementById("sparkTop");
      const sparkBottom = document.getElementById("sparkBottom");

      sparkTop.classList.remove("show");
      sparkBottom.classList.remove("show");

      void sparkTop.offsetWidth;
      void sparkBottom.offsetWidth;

      sparkTop.classList.add("show");
      sparkBottom.classList.add("show");
    }

    function drawCard() {
      if (isDrawing) return;
      isDrawing = true;

      drawBtn.disabled = true;
      drawBtn.style.opacity = "0.7";

      cardWrap.classList.remove("pulse");
      void cardWrap.offsetWidth;
      cardWrap.classList.add("pulse");

      cardImg.src = backUrl;
      statusEl.textContent = "הקלף נפתח…";

      const picked = cards[Math.floor(Math.random() * cards.length)];

      setTimeout(() => {
        cardImg.src = picked.front;
        flashSparkles();

        let count = Number(localStorage.getItem("drawCount") || 0);
        count++;
        localStorage.setItem("drawCount", count);

        updateActionButton(count);

        statusEl.textContent = "קלף מספר " + picked.id;
        drawBtn.disabled = false;
        drawBtn.style.opacity = "1";
        isDrawing = false;
      }, 520);
    }

    cardImg.onerror = function() {
      statusEl.textContent = "לא ניתן לטעון את התמונה. כנראה שצריך לפתוח את קבצי Google Drive לשיתוף ציבורי.";
      drawBtn.disabled = false;
      drawBtn.style.opacity = "1";
      isDrawing = false;
    };

    cardImg.src = backUrl;
    drawBtn.addEventListener("click", drawCard);

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("sw.js");
      });
    }
  </script>
</body>
</html>
