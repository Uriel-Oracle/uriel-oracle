<!DOCTYPE html>

  <link rel="manifest" href="manifest.json">

  <title>המלאך אוריאל</title>
  <link rel="icon" type="image/png" href="icon.png">
<link rel="shortcut icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
  <style>

    :root {
      --bg1:#140a24;
      --bg2:#2a1248;
      --gold:#e9c766;
      --text:#faf5ff;
      --muted:#d9caeb;
    }
    * { box-sizing:border-box; }
    body {
      margin:0;
      min-height:100vh;
      font-family:Arial, "Noto Sans Hebrew", sans-serif;
      color:var(--text);
      background:
        radial-gradient(circle at 50% 18%, rgba(233,199,102,.18), transparent 22%),
        linear-gradient(180deg, var(--bg2), var(--bg1) 62%);
      display:flex;
      justify-content:center;
      align-items:center;
      padding:24px 16px 40px;
    }
    .app {
      width:min(100%, 520px);
      text-align:center;
    }
    .portal {
      animation:fadeIn .9s ease;
      margin-bottom:24px;
    }
    @keyframes fadeIn {
      from { opacity:0; transform:translateY(12px); }
      to { opacity:1; transform:translateY(0); }
    }
    h1 {
      margin:0;
      font-size:clamp(28px, 5vw, 40px);
      line-height:1.18;
      text-shadow:0 0 16px rgba(233,199,102,.15);
    }
    .name {
      margin-top:10px;
      font-size:18px;
      color:var(--muted);
    }
    .tagline {
      margin-top:8px;
      font-size:20px;
    }
    button {
      margin-top:18px;
      border:0;
      border-radius:999px;
      padding:15px 30px;
      font-size:22px;
      font-weight:700;
      cursor:pointer;
      color:#3b1b50;
      background:linear-gradient(180deg, #fff6b7, var(--gold));
      box-shadow:0 10px 24px rgba(0,0,0,.22), 0 0 18px rgba(233,199,102,.18);
    }
    .stage {
      position:relative;
      width:min(100%, 390px);
      margin:26px auto 0;
    }
    .card {
      width:100%;
      aspect-ratio:909 / 1252;
      border-radius:30px;
      overflow:hidden;
      box-shadow:0 20px 50px rgba(0,0,0,.42), 0 0 22px rgba(233,199,102,.14);
      background:rgba(255,255,255,.02);
    }
    .card img {
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
      user-select:none;
      -webkit-user-drag:none;
    }
    .sparkles {
      position:absolute;
      left:50%;
      transform:translateX(-50%);
      width:88%;
      height:120px;
      pointer-events:none;
      opacity:0;
      z-index:3;
    }
    .sparkles.top { top:10px; }
    .sparkles.bottom { bottom:10px; transform:translateX(-50%) scaleY(-1); }
    .sparkles.show { animation:sparkleFade 1.45s ease forwards; }
    .sparkles::before {
      content:"";
      position:absolute;
      inset:0;
      background:
        radial-gradient(circle at 10% 46%, rgba(255,234,186,.98) 0 2px, transparent 3px),
        radial-gradient(circle at 22% 28%, rgba(255,214,104,.98) 0 1.8px, transparent 3px),
        radial-gradient(circle at 34% 58%, rgba(255,247,224,.98) 0 2px, transparent 3px),
        radial-gradient(circle at 46% 34%, rgba(247,196,91,.98) 0 2px, transparent 3px),
        radial-gradient(circle at 58% 54%, rgba(255,239,187,.98) 0 1.7px, transparent 3px),
        radial-gradient(circle at 72% 38%, rgba(255,213,110,.98) 0 2px, transparent 3px),
        radial-gradient(circle at 84% 61%, rgba(255,248,228,.98) 0 2px, transparent 3px),
        radial-gradient(circle at 94% 42%, rgba(255,206,95,.98) 0 1.8px, transparent 3px);
      animation:drift 1.45s ease-out forwards;
    }
    @keyframes sparkleFade {
      0% { opacity:0; }
      15% { opacity:1; }
      100% { opacity:0; }
    }
    @keyframes drift {
      0% { transform:translateY(8px) scale(.97); opacity:0; }
      18% { transform:translateY(0) scale(1); opacity:1; }
      100% { transform:translateY(-18px) scale(1.02); opacity:0; }
    }
    .status {
      min-height:28px;
      margin-top:16px;
      color:var(--muted);
      font-size:15px;
    }
  
  /* Remove mobile tap highlight and focus outline */
  button, .btn, .button {
    outline: none !important;
    -webkit-tap-highlight-color: transparent;
  }
  button:focus, button:active,
  .btn:focus, .btn:active,
  .button:focus, .button:active {
    outline: none !important;
    box-shadow: none !important;
  }


    .card.pulse {
      animation: mandalaPulse 0.85s ease;
    }
    @keyframes mandalaPulse {
  0% { transform: scale(1); }
  40% { transform: scale(1.02); }
  100% { transform: scale(1); }
}

  </style>
</head>

      void sparkBottom.offsetWidth;

    }
